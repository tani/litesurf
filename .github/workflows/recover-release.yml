name: Publish prepared release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Run containing the verified release-tarballs artifact
        required: true
        type: string
      tag:
        description: Existing release tag matching that run
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  gh_release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_RUN: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag || 'v0.0.1' }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify artifact run matches the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]
          run_sha="$(gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN" --jq .head_sha)"
          tag_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$run_sha" = "$tag_sha"

      - name: Install verification tools
        run: npm ci --ignore-scripts --no-audit --no-fund

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: release-assets
          run-id: ${{ env.SOURCE_RUN }}
          github-token: ${{ github.token }}

      - name: Find and verify the prepared release
        id: assets
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import {dirname} from 'node:path';
          import {fs, glob} from 'zx';
          import {verify} from './scripts/verify-release.mjs';
          const manifests = glob.sync('release-assets/**/release.json');
          assert.equal(manifests.length, 1, 'Expected exactly one release manifest');
          const directory = dirname(manifests[0]);
          const manifest = await verify(directory);
          assert.equal(manifest.tag, process.env.RELEASE_TAG);
          assert.equal(manifest.repository, process.env.GH_REPO);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `directory=${directory}\n`);
          JS

      - name: Publish all verified assets together
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_DIRECTORY: ${{ steps.assets.outputs.directory }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "litesurf $RELEASE_TAG" \
            --notes-file "$ASSET_DIRECTORY/RELEASE_NOTES.txt" \
            "$ASSET_DIRECTORY"/*.tgz "$ASSET_DIRECTORY"/*.tar.gz \
            "$ASSET_DIRECTORY/SHA256SUMS" "$ASSET_DIRECTORY/release.json"
          gh release edit "$RELEASE_TAG" --draft=false
          node scripts/verify-publish.mjs "$ASSET_DIRECTORY"
